name: Diligent
description: >-
  Diligent (Diligent AI, godiligent.ai) builds autonomous AI agents for
  financial-crime compliance, automating the reasoning-heavy KYC/AML workflows
  that banks and fintechs run at scale. Its API exposes Customer Due Diligence
  (CDD) and business/merchant verification, name screening against sanctions and
  PEP providers with AI-powered alert remediation, ongoing monitoring with
  alerting, company identification and registry document retrieval, a blocked-company
  list, and an experimental instant website screening endpoint. The platform is
  API-first (X-API-KEY auth, production and sandbox environments, idempotency, and
  signed webhooks) and is used by fintechs and banks including Scalapay, Flywire,
  Allica Bank, Tamara, Teya, Vivid and Alma. Diligent is SOC 2 Type II certified,
  ISO 27001 certified, and GDPR compliant. It is backed by Speedinvest, Y Combinator
  and Shapers, and operates out of London and Berlin.
